<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    #pet-area {
      width: 100%;
      height: 100%;
      position: relative;
      -webkit-app-region: drag;
    }

    canvas {
      -webkit-app-region: no-drag;
      cursor: pointer;
    }

    /* Speech bubble */
    .bubble {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 18px;
      padding: 10px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #333;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      max-width: 240px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      animation: bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid white;
    }

    .bubble.hidden { display: none; }

    @keyframes bubblePop {
      0% { transform: translateX(-50%) scale(0); opacity: 0; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

    /* Chat input */
    .chat-container {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
      -webkit-app-region: no-drag;
    }

    .chat-container.visible {
      display: flex;
      animation: slideUp 0.3s ease-out;
    }

    .chat-input {
      width: 220px;
      padding: 10px 14px;
      border: 2px solid #7C6FF7;
      border-radius: 20px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      outline: none;
      background: white;
      box-shadow: 0 4px 15px rgba(124, 111, 247, 0.2);
    }

    .chat-input::placeholder {
      color: #bbb;
    }

    @keyframes slideUp {
      0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
      100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="pet-area">
    <div class="bubble" id="bubble">뭐 해줄까? 클릭해봐! 👋</div>
    <div id="canvas-container"></div>
    <div class="chat-container" id="chatContainer">
      <input class="chat-input" id="chatInput" placeholder="할 일을 말해줘..." autofocus />
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const THREE = require('three');
    const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
    const path = require('path');

    // --- State ---
    let state = 'idle';
    let mixer = null;
    let animations = {};
    let currentAction = null;
    let robot = null;

    // --- Three.js setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 300 / 350, 0.1, 100);
    camera.position.set(0, 1.2, 4);
    camera.lookAt(0, 0.8, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(300, 350);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // --- Lighting ---
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(3, 5, 4);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x9988ff, 0.5);
    rimLight.position.set(-3, 2, -2);
    scene.add(rimLight);

    // --- Shadow on ground ---
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.6, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.01;
    scene.add(shadow);

    // --- Character group ---
    const charGroup = new THREE.Group();
    scene.add(charGroup);

    // --- Load Robot ---
    const loader = new GLTFLoader();
    const modelPath = path.join(__dirname, 'assets', 'robot.glb');

    loader.load(modelPath, (gltf) => {
      robot = gltf.scene;
      robot.scale.set(0.3, 0.3, 0.3);
      robot.position.y = 0;
      charGroup.add(robot);

      // Setup animations
      mixer = new THREE.AnimationMixer(robot);
      gltf.animations.forEach((clip) => {
        animations[clip.name] = mixer.clipAction(clip);
      });

      // Start with idle (Wave or Idle)
      playAnimation('Idle');
      console.log('Available animations:', Object.keys(animations));
    });

    function playAnimation(name, options = {}) {
      if (!animations[name]) return;
      const newAction = animations[name];

      if (currentAction && currentAction !== newAction) {
        currentAction.fadeOut(0.3);
      }

      newAction.reset();
      newAction.fadeIn(0.3);
      newAction.setLoop(options.loop !== false ? THREE.LoopRepeat : THREE.LoopOnce);
      if (options.timeScale) newAction.timeScale = options.timeScale;
      newAction.play();
      currentAction = newAction;
    }

    // --- Mouse tracking ---
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / 300) * 2 - 1;
      mouseY = -(e.clientY / 350) * 2 + 1;
    });

    // --- Click → show chat ---
    renderer.domElement.addEventListener('click', () => {
      if (state === 'idle') {
        state = 'chatting';
        document.getElementById('chatContainer').classList.add('visible');
        document.getElementById('chatInput').focus();
        setBubble('할 일을 입력해줘! ⌨️');
        playAnimation('Wave', { loop: false });
        // Return to idle after wave
        setTimeout(() => {
          if (state === 'chatting') playAnimation('Idle');
        }, 1500);
      }
    });

    // --- Send message on Enter ---
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const msg = e.target.value.trim();
        e.target.value = '';
        document.getElementById('chatContainer').classList.remove('visible');
        setBubble(`"${msg}" 알겠어! 가볼게! 🏃`);
        playAnimation('Running', { timeScale: 1.5 });
        ipcRenderer.send('start-task', msg);
      }
      if (e.key === 'Escape') {
        document.getElementById('chatContainer').classList.remove('visible');
        state = 'idle';
        setBubble('뭐 해줄까? 클릭해봐! 👋');
        playAnimation('Idle');
      }
    });

    // --- IPC: run away ---
    ipcRenderer.on('run-away', () => {
      state = 'running-away';
      playAnimation('Running', { timeScale: 1.5 });
    });

    // --- IPC: come back ---
    ipcRenderer.on('come-back', (event, resultMsg) => {
      state = 'coming-back';
      charGroup.position.x = 5;
      charGroup.visible = true;
      shadow.visible = true;
      charGroup.rotation.y = Math.PI; // face left (coming back)
      playAnimation('Running');
      setBubble(resultMsg);
    });

    // --- Bubble helper ---
    function setBubble(text) {
      const bubble = document.getElementById('bubble');
      bubble.classList.remove('hidden');
      bubble.style.animation = 'none';
      bubble.offsetHeight;
      bubble.style.animation = 'bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      bubble.textContent = text;
    }

    // --- Animation loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      if (mixer) mixer.update(delta);

      if (state === 'idle' || state === 'chatting') {
        charGroup.position.x = 0;
        charGroup.rotation.y = 0;

        // Gentle look toward mouse
        if (robot) {
          robot.rotation.y += (mouseX * 0.5 - robot.rotation.y) * 0.05;
        }

        // Shadow
        shadow.visible = true;
        shadow.position.x = charGroup.position.x;
      }

      if (state === 'running-away') {
        charGroup.position.x += 0.08;
        charGroup.rotation.y = Math.PI / 2; // face right

        if (charGroup.position.x > 5) {
          state = 'gone';
          charGroup.visible = false;
          shadow.visible = false;
          document.getElementById('bubble').classList.add('hidden');
        }
      }

      if (state === 'coming-back') {
        charGroup.position.x += (0 - charGroup.position.x) * 0.06;
        charGroup.rotation.y = -Math.PI / 2; // face left

        if (Math.abs(charGroup.position.x) < 0.1) {
          charGroup.position.x = 0;
          charGroup.rotation.y = 0;
          state = 'idle';
          playAnimation('ThumbsUp', { loop: false });
          setTimeout(() => {
            if (state === 'idle') playAnimation('Idle');
          }, 2000);
        }
      }

      shadow.position.x = charGroup.position.x;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
