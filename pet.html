<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    #pet-area {
      width: 100%;
      height: 100%;
      position: relative;
      -webkit-app-region: drag;
    }
    canvas { -webkit-app-region: no-drag; cursor: pointer; }

    .bubble {
      position: absolute;
      top: 8px;
      left: 80px;
      background: white;
      border-radius: 14px;
      padding: 6px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: #333;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      max-width: 180px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      animation: bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 30px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid white;
    }
    .bubble.hidden { display: none; }
    @keyframes bubblePop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .chat-container {
      position: absolute;
      bottom: 8px;
      left: 30px;
      z-index: 20;
      display: none;
      -webkit-app-region: no-drag;
    }
    .chat-container.visible {
      display: flex;
      animation: slideUp 0.3s ease-out;
    }
    .chat-input {
      width: 180px;
      padding: 6px 10px;
      border: 2px solid #7C6FF7;
      border-radius: 14px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      outline: none;
      background: white;
      box-shadow: 0 4px 15px rgba(124, 111, 247, 0.2);
    }
    .chat-input::placeholder { color: #bbb; }
    @keyframes slideUp {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="pet-area">
    <div class="bubble hidden" id="bubble"></div>
    <div id="canvas-container"></div>
    <div class="chat-container" id="chatContainer">
      <input class="chat-input" id="chatInput" placeholder="할 일을 말해줘..." />
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const THREE = require('three');
    const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
    const pathModule = require('path');

    // --- Scene setup ---
    const W = 300, H = 280;
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
    camera.position.set(0, 1.0, 5.5);
    camera.lookAt(0, 0.3, -0.3);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dl = new THREE.DirectionalLight(0xffffff, 1.2);
    dl.position.set(3, 5, 4);
    scene.add(dl);

    // Shadow plane
    const shadowGeo = new THREE.PlaneGeometry(8, 4);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.05 });
    const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.01;
    scene.add(shadowPlane);

    // --- Pet data ---
    const pets = []; // { id, name, color, group, mixer, animations, currentAction, state, queueIndex, targetPos }
    let activeChatPetId = null;

    function applyColor(obj, hexColor) {
      const color = new THREE.Color(hexColor);
      obj.traverse((child) => {
        if (child.isMesh && child.material) {
          const mat = child.material.clone();
          const c = mat.color ? mat.color.clone() : new THREE.Color(1,1,1);
          const lum = c.r * 0.299 + c.g * 0.587 + c.b * 0.114;
          if (lum > 0.3 && lum < 0.9) mat.color.lerp(color, 0.6);
          child.material = mat;
        }
      });
    }

    function loadPet(config, index) {
      const loader = new GLTFLoader();
      const modelPath = pathModule.join(__dirname, 'assets', 'robot.glb');

      loader.load(modelPath, (gltf) => {
        const group = new THREE.Group();
        const model = gltf.scene;
        const initScale = 0.18 - index * 0.03;
        model.scale.set(initScale, initScale, initScale);
        applyColor(model, config.color);
        group.add(model);

        // Front pet = left & close (z small), back pet = right & far (z big)
        group.position.set(-0.5 + index * 0.5, 0, -index * 0.6);
        scene.add(group);

        const mixer = new THREE.AnimationMixer(model);
        const animations = {};
        gltf.animations.forEach(clip => {
          animations[clip.name] = mixer.clipAction(clip);
        });

        const pet = {
          id: config.id,
          name: config.name,
          color: config.color,
          group,
          model,
          mixer,
          animations,
          currentAction: null,
          state: 'idle', // idle, running-away, gone, coming-back
          returnedAt: Date.now() - (2 - index) * 1000,
          queueIndex: index,
          targetScale: 0.18 - index * 0.03,
          targetX: -0.5 + index * 0.5,
          targetZ: -index * 0.6,
        };

        playPetAnim(pet, 'Idle');
        pets.push(pet);

        // Show greeting for front pet
        if (index === 0) {
          setBubble(`안녕! 나는 ${config.name}! 👋`);
        }
      });
    }

    function playPetAnim(pet, name, options = {}) {
      if (!pet.animations[name]) return;
      const newAction = pet.animations[name];
      if (pet.currentAction && pet.currentAction !== newAction) {
        pet.currentAction.fadeOut(0.3);
      }
      newAction.reset();
      newAction.fadeIn(0.3);
      newAction.setLoop(options.loop !== false ? THREE.LoopRepeat : THREE.LoopOnce);
      if (options.timeScale) newAction.timeScale = options.timeScale;
      newAction.play();
      pet.currentAction = newAction;
    }

    // --- Queue management ---
    // Sort idle pets: front (index 0) = leftmost & closest to camera
    function updateQueue() {
      const idlePets = pets.filter(p => p.state === 'idle').sort((a, b) => {
        // Earlier returned = front (waited longer)
        return a.returnedAt - b.returnedAt;
      });

      idlePets.forEach((pet, i) => {
        pet.queueIndex = i;
        pet.targetX = -0.5 + i * 0.5;
        pet.targetZ = -i * 0.6;
        pet.targetScale = 0.18 - i * 0.03; // front=0.18, mid=0.15, back=0.12
      });
    }

    // --- Bubble ---
    function setBubble(text) {
      const bubble = document.getElementById('bubble');
      bubble.classList.remove('hidden');
      bubble.style.animation = 'none';
      bubble.offsetHeight;
      bubble.style.animation = 'bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      bubble.textContent = text;
    }

    function hideBubble() {
      document.getElementById('bubble').classList.add('hidden');
    }

    // --- Init ---
    ipcRenderer.on('init-pets', (event, configs) => {
      configs.forEach((config, i) => loadPet(config, i));
    });

    // --- Open chat ---
    ipcRenderer.on('open-chat', (event, petId) => {
      const pet = pets.find(p => p.id === petId && p.state === 'idle');
      if (!pet) return;

      activeChatPetId = petId;
      playPetAnim(pet, 'Wave', { loop: false });
      setTimeout(() => {
        if (pet.state === 'idle') playPetAnim(pet, 'Idle');
      }, 1500);

      setBubble(`할 일을 입력해줘! ⌨️`);
      document.getElementById('chatContainer').classList.add('visible');
      document.getElementById('chatInput').focus();
      document.querySelector('.chat-input').style.borderColor = pet.color;
    });

    // --- Summon all ---
    ipcRenderer.on('summon-all', () => {
      // Bring all idle pets to front row
      const idlePets = pets.filter(p => p.state === 'idle');
      idlePets.forEach((pet, i) => {
        pet.targetX = -0.5 + i * 0.5;
        pet.targetZ = 0;
        playPetAnim(pet, 'Wave', { loop: false });
        setTimeout(() => {
          if (pet.state === 'idle') playPetAnim(pet, 'Idle');
        }, 1800);
      });
    });

    // --- Chat input ---
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const msg = e.target.value.trim();
        e.target.value = '';
        document.getElementById('chatContainer').classList.remove('visible');
        setBubble(`"${msg}" 알겠어! 🏃`);
        ipcRenderer.send('start-task', { petId: activeChatPetId, message: msg });
        ipcRenderer.send('chat-closed');
        activeChatPetId = null;
      }
      if (e.key === 'Escape') {
        document.getElementById('chatContainer').classList.remove('visible');
        hideBubble();
        ipcRenderer.send('chat-closed');
        activeChatPetId = null;
      }
    });

    // --- Pet run away ---
    ipcRenderer.on('pet-run-away', (event, petId) => {
      const pet = pets.find(p => p.id === petId);
      if (!pet) return;
      pet.state = 'running-away';
      playPetAnim(pet, 'Running', { timeScale: 1.5 });
    });

    // --- Pet come back ---
    ipcRenderer.on('pet-come-back', (event, { petId, message }) => {
      const pet = pets.find(p => p.id === petId);
      if (!pet) return;
      pet.state = 'coming-back';
      pet.group.position.set(5, 0, 0); // come from right
      pet.group.visible = true;
      playPetAnim(pet, 'Running');
      setBubble(`${pet.name}: ${message}`);

      // Will transition to idle in animate loop
    });

    // --- Click on canvas ---
    renderer.domElement.addEventListener('click', (e) => {
      // Raycast to find which pet was clicked
      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      // Check front pet first
      const idlePets = pets.filter(p => p.state === 'idle');
      for (const pet of idlePets) {
        const intersects = raycaster.intersectObject(pet.group, true);
        if (intersects.length > 0) {
          activeChatPetId = pet.id;
          playPetAnim(pet, 'Wave', { loop: false });
          setTimeout(() => { if (pet.state === 'idle') playPetAnim(pet, 'Idle'); }, 1500);
          setBubble(`나는 ${pet.name}! 할 일을 말해줘!`);
          document.getElementById('chatContainer').classList.add('visible');
          document.getElementById('chatInput').focus();
          document.querySelector('.chat-input').style.borderColor = pet.color;
          break;
        }
      }
    });

    // --- Animation loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      pets.forEach(pet => {
        if (pet.mixer) pet.mixer.update(delta);

        if (pet.state === 'idle') {
          const dx = pet.targetX - pet.group.position.x;
          const dz = pet.targetZ - pet.group.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);

          pet.group.position.x += dx * 0.05;
          pet.group.position.z += dz * 0.05;
          pet.group.visible = true;

          if (dist > 0.15) {
            pet.group.rotation.y = Math.atan2(dx, dz);
            if (!pet._walking) {
              playPetAnim(pet, 'Walking');
              pet._walking = true;
            }
          } else {
            pet.group.rotation.y += (0 - pet.group.rotation.y) * 0.05;
            if (pet._walking) {
              playPetAnim(pet, 'Idle');
              pet._walking = false;
            }
          }

          // Smooth scale transition
          const cs = pet.model.scale.x;
          const ts = pet.targetScale || 0.18;
          const ns = cs + (ts - cs) * 0.1;
          pet.model.scale.set(ns, ns, ns);
        }

        if (pet.state === 'running-away') {
          pet.group.position.x += 0.1;
          pet.group.rotation.y = Math.PI / 2;
          if (pet.group.position.x > 6) {
            pet.state = 'gone';
            pet.group.visible = false;
            updateQueue();
          }
        }

        if (pet.state === 'coming-back') {
          const idleCount = pets.filter(p => p.state === 'idle').length;
          const targetX = -0.5 + idleCount * 0.5;
          const targetZ = -idleCount * 0.6;
          const targetS = 0.18 - idleCount * 0.03;

          // Set scale immediately before entering
          pet.model.scale.set(targetS, targetS, targetS);
          pet.targetScale = targetS;

          pet.group.position.x += (targetX - pet.group.position.x) * 0.05;
          pet.group.position.z += (targetZ - pet.group.position.z) * 0.05;
          pet.group.rotation.y += (0 - pet.group.rotation.y) * 0.05;

          if (Math.abs(pet.group.position.x - targetX) < 0.1) {
            pet.state = 'idle';
            pet.returnedAt = Date.now();
            pet.targetX = targetX;
            pet.targetZ = targetZ;
            playPetAnim(pet, 'ThumbsUp', { loop: false });
            setTimeout(() => {
              if (pet.state === 'idle') playPetAnim(pet, 'Idle');
            }, 2000);
            updateQueue();
          }
        }
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
