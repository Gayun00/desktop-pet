<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.working { background: #fbbf24; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #status-text { font-weight: 500; }

    .task-display {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 0 20px 16px;
      color: white;
      font-size: 13px;
    }

    .task-display .label {
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    #office-canvas {
      width: 100%;
      height: calc(100vh - 120px);
    }

    .log-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      font-family: 'SF Mono', monospace;
      max-height: 100px;
      overflow-y: auto;
    }

    .log-entry {
      padding: 2px 0;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot" id="statusDot"></div>
    <span id="status-text">대기 중...</span>
  </div>
  <div class="task-display" id="taskDisplay" style="display:none;">
    <div class="label">현재 작업</div>
    <div id="taskText"></div>
  </div>
  <canvas id="office-canvas"></canvas>
  <div class="log-panel" id="logPanel"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const THREE = require('three');
    const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
    const path = require('path');

    // --- Three.js setup ---
    const canvas = document.getElementById('office-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 5, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // --- Lighting ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(5, 8, 5);
    scene.add(dl);

    // --- Floor ---
    const floorGeo = new THREE.PlaneGeometry(12, 12);
    const floorMat = new THREE.MeshToonMaterial({ color: 0x2a2a4a });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(12, 12, 0x4a4a6a, 0x3a3a5a);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // --- Desks ---
    function createDesk(x, z) {
      const g = new THREE.Group();
      const top = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.08, 0.8),
        new THREE.MeshToonMaterial({ color: 0x8B7355 })
      );
      top.position.y = 0.6;
      g.add(top);
      const monitor = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.4, 0.05),
        new THREE.MeshToonMaterial({ color: 0x333333 })
      );
      monitor.position.set(0, 0.95, -0.2);
      g.add(monitor);
      const screenMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.5, 0.3),
        new THREE.MeshBasicMaterial({ color: 0x66aaff })
      );
      screenMesh.position.set(0, 0.95, -0.17);
      g.add(screenMesh);
      g.position.set(x, 0, z);
      return g;
    }

    scene.add(createDesk(-2.5, -1));
    scene.add(createDesk(0, -2));
    scene.add(createDesk(2.5, -1));

    // --- Load Robot ---
    const charGroup = new THREE.Group();
    charGroup.visible = false;
    scene.add(charGroup);

    let mixer = null;
    let animations = {};
    let currentAction = null;
    let robot = null;

    const loader = new GLTFLoader();
    const modelPath = path.join(__dirname, 'assets', 'robot.glb');

    loader.load(modelPath, (gltf) => {
      robot = gltf.scene;
      robot.scale.set(0.4, 0.4, 0.4);
      charGroup.add(robot);

      mixer = new THREE.AnimationMixer(robot);
      gltf.animations.forEach((clip) => {
        animations[clip.name] = mixer.clipAction(clip);
      });
    });

    function playAnimation(name, options = {}) {
      if (!animations[name]) return;
      const newAction = animations[name];
      if (currentAction && currentAction !== newAction) {
        currentAction.fadeOut(0.2);
      }
      newAction.reset();
      newAction.fadeIn(0.2);
      newAction.setLoop(options.loop !== false ? THREE.LoopRepeat : THREE.LoopOnce);
      if (options.timeScale) newAction.timeScale = options.timeScale;
      newAction.play();
      currentAction = newAction;
    }

    // --- Waypoints ---
    const waypoints = [
      { x: -2.5, z: 0 },
      { x: 0, z: -1 },
      { x: 2.5, z: 0 },
      { x: 1, z: 2 },
      { x: -1, z: 2 },
      { x: 0, z: 0 },
    ];

    let currentWP = 0;
    let targetPos = new THREE.Vector3(0, 0, 0);
    let officeState = 'idle';

    function pickNextWaypoint() {
      currentWP = (currentWP + 1) % waypoints.length;
      targetPos.set(waypoints[currentWP].x, 0, waypoints[currentWP].z);
    }

    // --- Logs ---
    const logMessages = [
      '코드 분석 중...',
      'Sentry 이슈 확인 중...',
      '관련 파일 검색 중...',
      '수정 방안 검토 중...',
      '테스트 실행 중...',
      '결과 정리 중...',
      'Slack 메시지 확인...',
      'Jira 티켓 업데이트 중...',
    ];
    let logIndex = 0;

    function addLog(msg) {
      const panel = document.getElementById('logPanel');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entry.textContent = `[${time}] ${msg}`;
      panel.appendChild(entry);
      panel.scrollTop = panel.scrollHeight;
    }

    // --- IPC ---
    ipcRenderer.on('task-started', (event, msg) => {
      officeState = 'entering';
      charGroup.visible = true;
      charGroup.position.set(8, 0, 0);
      playAnimation('Running', { timeScale: 1.5 });

      document.getElementById('statusDot').classList.add('working');
      document.getElementById('status-text').textContent = '도착 중...';
      document.getElementById('taskDisplay').style.display = 'block';
      document.getElementById('taskText').textContent = msg;
      addLog(`🏃 캐릭터가 달려오는 중...`);

      setTimeout(() => {
        if (officeState === 'entering') {
          officeState = 'working';
          pickNextWaypoint();
          playAnimation('Running');
          addLog(`📋 새 작업: "${msg}"`);
          document.getElementById('status-text').textContent = '작업 중...';
        }
      }, 2000);

      const logInterval = setInterval(() => {
        if (officeState === 'exiting' || officeState === 'idle') { clearInterval(logInterval); return; }
        addLog(logMessages[logIndex % logMessages.length]);
        logIndex++;
      }, 1200);
    });

    ipcRenderer.on('task-done', (event, msg) => {
      officeState = 'exiting';
      playAnimation('Running', { timeScale: 1.5 });
      addLog(`✅ 완료! "${msg}"`);
      addLog(`🏃 캐릭터가 돌아가는 중...`);
      document.getElementById('statusDot').classList.remove('working');
      document.getElementById('status-text').textContent = '완료! 돌아가는 중...';
    });

    // --- Animation ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      if (mixer) mixer.update(delta);

      if (officeState === 'entering') {
        const enterTarget = new THREE.Vector3(0, 0, 0);
        const dx = enterTarget.x - charGroup.position.x;
        const dz = enterTarget.z - charGroup.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist > 0.3) {
          const speed = 0.1;
          charGroup.position.x += (dx / dist) * speed;
          charGroup.position.z += (dz / dist) * speed;
          charGroup.rotation.y = Math.atan2(dx, dz);
        }
      }

      if (officeState === 'working') {
        const dx = targetPos.x - charGroup.position.x;
        const dz = targetPos.z - charGroup.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist > 0.3) {
          const speed = 0.05;
          charGroup.position.x += (dx / dist) * speed;
          charGroup.position.z += (dz / dist) * speed;
          charGroup.rotation.y = Math.atan2(dx, dz);
        } else {
          pickNextWaypoint();
        }
      }

      if (officeState === 'exiting') {
        charGroup.position.x -= 0.1;
        charGroup.rotation.y = -Math.PI / 2;

        if (charGroup.position.x < -8) {
          officeState = 'idle';
          charGroup.visible = false;
          document.getElementById('status-text').textContent = '돌아갔어!';
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });
  </script>
</body>
</html>
