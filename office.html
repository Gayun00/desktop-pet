<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .header {
      padding: 12px 20px;
      color: white;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 5;
    }

    #status-text { font-weight: 500; flex: 1; }

    .theme-selector {
      display: flex;
      gap: 6px;
    }

    .theme-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn:hover { border-color: white; transform: scale(1.1); }
    .theme-btn.active { border-color: white; box-shadow: 0 0 8px rgba(255,255,255,0.5); }

    .theme-btn[data-theme="office"] { background: linear-gradient(135deg, #2a2a4a, #4a4a6a); }
    .theme-btn[data-theme="restaurant"] { background: linear-gradient(135deg, #ff8844, #ffcc44); }
    .theme-btn[data-theme="furniture"] { background: linear-gradient(135deg, #aa8866, #ddbb88); }
    .theme-btn[data-theme="forest"] { background: linear-gradient(135deg, #2d5016, #4a8c2a); }
    .theme-btn[data-theme="space"] { background: linear-gradient(135deg, #0a0a2e, #1a0a3e); }

    .tasks-bar {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      overflow-x: auto;
      background: rgba(0,0,0,0.15);
      position: relative;
      z-index: 5;
    }

    .task-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 5px 12px;
      color: white;
      font-size: 11px;
      white-space: nowrap;
      animation: chipIn 0.3s ease-out;
    }

    .task-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .task-chip.done { opacity: 0.5; }
    .task-chip.done .dot { animation: none; }

    @keyframes chipIn { 0% { transform: translateY(-10px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    #office-canvas {
      width: 100%;
      height: calc(100vh - 90px);
    }

    .log-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      padding: 8px 20px;
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      font-family: 'SF Mono', 'Menlo', monospace;
      max-height: 80px;
      overflow-y: auto;
      z-index: 5;
    }

    .log-entry {
      padding: 1px 0;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="header">
    <span id="status-text">대기 중...</span>
    <div class="theme-selector">
      <div class="theme-btn active" data-theme="office" title="사무실"></div>
      <div class="theme-btn" data-theme="restaurant" title="레스토랑"></div>
      <div class="theme-btn" data-theme="furniture" title="사무실"></div>
      <div class="theme-btn" data-theme="forest" title="숲"></div>
      <div class="theme-btn" data-theme="space" title="우주"></div>
    </div>
  </div>
  <div class="tasks-bar" id="tasksBar"></div>
  <canvas id="office-canvas"></canvas>
  <div class="log-panel" id="logPanel"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const THREE = require('three');
    const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
    const pathModule = require('path');

    // --- Three.js setup ---
    const canvas = document.getElementById('office-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 5, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;

    // --- Lighting (will be adjusted per theme) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- Theme props container ---
    const propsGroup = new THREE.Group();
    scene.add(propsGroup);

    // --- Shared loader ---
    const gltfLoader = new GLTFLoader();
    const animatedObjects = []; // { mixer, group } for theme-specific animated models

    // =============================================
    // THEMES
    // =============================================

    const themes = {

      // --- OFFICE ---
      office: {
        bg: 0x1a1a2e,
        floor: { color: 0x2a2a4a },
        ambient: { color: 0xffffff, intensity: 0.6 },
        dirLight: { color: 0xffffff, intensity: 1.0 },
        fog: null,
        build(group) {
          // Grid
          const grid = new THREE.GridHelper(14, 14, 0x4a4a6a, 0x3a3a5a);
          grid.position.y = 0.02;
          group.add(grid);

          // Desks
          function desk(x, z) {
            const g = new THREE.Group();
            const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.8), new THREE.MeshToonMaterial({ color: 0x8B7355 }));
            top.position.y = 0.6; g.add(top);
            const mon = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.05), new THREE.MeshToonMaterial({ color: 0x333333 }));
            mon.position.set(0, 0.95, -0.2); g.add(mon);
            const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), new THREE.MeshBasicMaterial({ color: 0x66aaff }));
            scr.position.set(0, 0.95, -0.17); g.add(scr);
            // Chair
            const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.05, 16), new THREE.MeshToonMaterial({ color: 0x444444 }));
            seat.position.set(0, 0.4, 0.5); g.add(seat);
            const backrest = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.35, 0.05), new THREE.MeshToonMaterial({ color: 0x444444 }));
            backrest.position.set(0, 0.6, 0.7); g.add(backrest);
            g.position.set(x, 0, z);
            return g;
          }
          group.add(desk(-3, -1));
          group.add(desk(0, -2));
          group.add(desk(3, -1));
          group.add(desk(-1.5, 1));
          group.add(desk(1.5, 1));

          // Coffee machine
          const coffee = new THREE.Group();
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.25), new THREE.MeshToonMaterial({ color: 0x222222 }));
          body.position.y = 0.85; coffee.add(body);
          const coffeeTable = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.08, 0.5), new THREE.MeshToonMaterial({ color: 0x8B7355 }));
          coffeeTable.position.y = 0.6; coffee.add(coffeeTable);
          const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.1, 8), new THREE.MeshToonMaterial({ color: 0xeeeeee }));
          cup.position.set(0.2, 0.7, 0); coffee.add(cup);
          coffee.position.set(5, 0, -2);
          group.add(coffee);

          // Plant
          const plant = new THREE.Group();
          const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.3, 8), new THREE.MeshToonMaterial({ color: 0xBB6633 }));
          pot.position.y = 0.15; plant.add(pot);
          for (let i = 0; i < 5; i++) {
            const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshToonMaterial({ color: 0x44aa44 }));
            leaf.position.set(Math.sin(i * 1.3) * 0.12, 0.4 + i * 0.06, Math.cos(i * 1.3) * 0.12);
            plant.add(leaf);
          }
          plant.position.set(-5, 0, -2);
          group.add(plant);

          // Whiteboard
          const wb = new THREE.Group();
          const board = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 0.05), new THREE.MeshToonMaterial({ color: 0xeeeeee }));
          board.position.y = 1.5; wb.add(board);
          const frame = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.3, 0.03), new THREE.MeshToonMaterial({ color: 0x888888 }));
          frame.position.set(0, 1.5, -0.02); wb.add(frame);
          wb.position.set(0, 0, -5);
          group.add(wb);
        }
      },

      // --- RESTAURANT (KayKit) ---
      restaurant: {
        bg: 0x2a2015,
        floor: { color: 0x333333 },
        ambient: { color: 0xffe8cc, intensity: 0.8 },
        dirLight: { color: 0xffddaa, intensity: 1.2 },
        fog: null,
        build(group) {
          gltfLoader.load(pathModule.join(__dirname, 'assets', 'restaurant_level.glb'), (gltf) => {
            const level = gltf.scene;
            const s = 0.3;
            level.scale.set(s, s, s);
            // Center: 20*0.3/2=3, 16*0.3/2=2.4
            level.position.set(-3, 0, -2.4);
            group.add(level);
          });
        }
      },

      // --- FURNITURE OFFICE ---
      furniture: {
        bg: 0xddeeff,
        floor: { color: 0xccbb99 },
        ambient: { color: 0xffffff, intensity: 0.9 },
        dirLight: { color: 0xffffff, intensity: 1.2 },
        fog: null,
        build(group) {
          gltfLoader.load(pathModule.join(__dirname, 'assets', 'office_level.glb'), (gltf) => {
            const level = gltf.scene;
            const s = 0.5;
            level.scale.set(s, s, s);
            level.position.set(0, 0, 0);
            group.add(level);
          });
        }
      },

      // --- FOREST ---
      forest: {
        bg: 0x87CEEB,
        floor: { color: 0x4a8c2a },
        ambient: { color: 0xfff5e1, intensity: 0.8 },
        dirLight: { color: 0xfff0c0, intensity: 1.2 },
        fog: { color: 0xc8e6c8, near: 8, far: 25 },
        build(group) {
          // Grass patches
          for (let i = 0; i < 30; i++) {
            const grass = new THREE.Mesh(
              new THREE.ConeGeometry(0.05, 0.15, 4),
              new THREE.MeshToonMaterial({ color: new THREE.Color().setHSL(0.3, 0.6 + Math.random() * 0.3, 0.35 + Math.random() * 0.15) })
            );
            grass.position.set((Math.random() - 0.5) * 12, 0.07, (Math.random() - 0.5) * 10);
            group.add(grass);
          }

          // Trees
          function tree(x, z, scale = 1) {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(
              new THREE.CylinderGeometry(0.1 * scale, 0.15 * scale, 1.2 * scale, 6),
              new THREE.MeshToonMaterial({ color: 0x8B5A2B })
            );
            trunk.position.y = 0.6 * scale; g.add(trunk);

            // Foliage layers
            const colors = [0x2d7a1e, 0x3a9c2a, 0x45b530];
            for (let i = 0; i < 3; i++) {
              const foliage = new THREE.Mesh(
                new THREE.ConeGeometry((0.6 - i * 0.12) * scale, 0.7 * scale, 7),
                new THREE.MeshToonMaterial({ color: colors[i] })
              );
              foliage.position.y = (1.2 + i * 0.45) * scale;
              g.add(foliage);
            }
            g.position.set(x, 0, z);
            return g;
          }

          group.add(tree(-4, -3, 1.2));
          group.add(tree(4.5, -2, 1.0));
          group.add(tree(-2, -4.5, 0.8));
          group.add(tree(5.5, -4, 0.7));
          group.add(tree(-5.5, 0, 1.1));
          group.add(tree(3, 3, 0.6));

          // Rocks
          function rock(x, z, s) {
            const geo = new THREE.DodecahedronGeometry(s, 0);
            const mat = new THREE.MeshToonMaterial({ color: 0x888888 });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, s * 0.5, z);
            m.rotation.set(Math.random(), Math.random(), 0);
            return m;
          }
          group.add(rock(-3, 2, 0.3));
          group.add(rock(2, -1, 0.2));
          group.add(rock(4, 1.5, 0.15));

          // Flowers
          for (let i = 0; i < 12; i++) {
            const flower = new THREE.Group();
            const stem = new THREE.Mesh(
              new THREE.CylinderGeometry(0.02, 0.02, 0.25, 4),
              new THREE.MeshToonMaterial({ color: 0x44aa44 })
            );
            stem.position.y = 0.12; flower.add(stem);
            const petal = new THREE.Mesh(
              new THREE.SphereGeometry(0.06, 6, 6),
              new THREE.MeshToonMaterial({ color: [0xff6b9d, 0xffa500, 0xff4444, 0xffff44, 0xff69b4][i % 5] })
            );
            petal.position.y = 0.28; flower.add(petal);
            flower.position.set((Math.random() - 0.5) * 10, 0, (Math.random() - 0.5) * 8);
            group.add(flower);
          }

          // Mushrooms
          function mushroom(x, z) {
            const g = new THREE.Group();
            const ms = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.15, 6), new THREE.MeshToonMaterial({ color: 0xeeddcc }));
            ms.position.y = 0.075; g.add(ms);
            const cap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshToonMaterial({ color: 0xcc3333 }));
            cap.position.y = 0.15; g.add(cap);
            // Dots
            for (let i = 0; i < 3; i++) {
              const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
              dot.position.set(Math.sin(i * 2.1) * 0.07, 0.18, Math.cos(i * 2.1) * 0.07);
              g.add(dot);
            }
            g.position.set(x, 0, z);
            return g;
          }
          group.add(mushroom(-1, 3));
          group.add(mushroom(3, -3));

          // Pond
          const pond = new THREE.Mesh(
            new THREE.CircleGeometry(0.8, 16),
            new THREE.MeshToonMaterial({ color: 0x4488cc, transparent: true, opacity: 0.7 })
          );
          pond.rotation.x = -Math.PI / 2;
          pond.position.set(1, 0.02, 2.5);
          group.add(pond);

          // Flying birds (animated GLB models)
          const birdConfigs = [
            { file: 'flamingo.glb', pos: [-2, 3.5, -2], scale: 0.008, speed: 1.2 },
            { file: 'parrot.glb', pos: [3, 4, 0], scale: 0.008, speed: 1.0 },
            { file: 'stork.glb', pos: [0, 3, 3], scale: 0.008, speed: 0.8 },
          ];
          birdConfigs.forEach(bc => {
            gltfLoader.load(pathModule.join(__dirname, 'assets', bc.file), (gltf) => {
              const bird = gltf.scene;
              bird.scale.set(bc.scale, bc.scale, bc.scale);
              bird.position.set(...bc.pos);
              group.add(bird);
              if (gltf.animations.length > 0) {
                const mix = new THREE.AnimationMixer(bird);
                mix.clipAction(gltf.animations[0]).play();
                bird.userData.mixer = mix;
                bird.userData.centerX = bc.pos[0];
                bird.userData.centerZ = bc.pos[2];
                bird.userData.radius = 2 + Math.random() * 2;
                bird.userData.speed = bc.speed;
                bird.name = 'bird';
                animatedObjects.push({ mixer: mix, obj: bird });
              }
            });
          });

          // Flower models
          const flowerPositions = [[-2, 0, 1], [1.5, 0, -1], [-0.5, 0, 3.5], [3.5, 0, 2], [-4, 0, 2]];
          flowerPositions.forEach(fp => {
            gltfLoader.load(pathModule.join(__dirname, 'assets', 'flower.glb'), (gltf) => {
              const fl = gltf.scene;
              fl.scale.set(1.5, 1.5, 1.5);
              fl.position.set(...fp);
              fl.rotation.y = Math.random() * Math.PI * 2;
              group.add(fl);
            });
          });
        }
      },

      // --- SPACE ---
      space: {
        bg: 0x050510,
        floor: { color: 0x111133 },
        ambient: { color: 0x4444ff, intensity: 0.4 },
        dirLight: { color: 0x8888ff, intensity: 0.8 },
        fog: null,
        build(group) {
          // Neon grid
          const neonGrid = new THREE.GridHelper(14, 14, 0x0066ff, 0x003388);
          neonGrid.position.y = 0.02;
          neonGrid.material.opacity = 0.5;
          neonGrid.material.transparent = true;
          group.add(neonGrid);

          // Stars
          const starGeo = new THREE.BufferGeometry();
          const starPositions = [];
          for (let i = 0; i < 300; i++) {
            starPositions.push(
              (Math.random() - 0.5) * 30,
              Math.random() * 15 + 2,
              (Math.random() - 0.5) * 30
            );
          }
          starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
          const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 });
          group.add(new THREE.Points(starGeo, starMat));

          // Planet 1
          const planet1 = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 16, 16),
            new THREE.MeshToonMaterial({ color: 0xff6644, emissive: 0x331100, emissiveIntensity: 0.3 })
          );
          planet1.position.set(-6, 6, -10);
          group.add(planet1);
          // Ring
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(2.0, 2.5, 32),
            new THREE.MeshBasicMaterial({ color: 0xffaa66, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
          );
          ring.rotation.x = Math.PI / 3;
          ring.position.copy(planet1.position);
          group.add(ring);

          // Planet 2 (small moon)
          const moon = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 12, 12),
            new THREE.MeshToonMaterial({ color: 0xccccdd })
          );
          moon.position.set(5, 4, -8);
          group.add(moon);

          // Space station panels
          function panel(x, z, h) {
            const g = new THREE.Group();
            const post = new THREE.Mesh(
              new THREE.CylinderGeometry(0.05, 0.05, h, 6),
              new THREE.MeshToonMaterial({ color: 0x444466 })
            );
            post.position.y = h / 2; g.add(post);
            const screen = new THREE.Mesh(
              new THREE.BoxGeometry(0.8, 0.5, 0.05),
              new THREE.MeshBasicMaterial({ color: 0x00ffaa })
            );
            screen.position.y = h; g.add(screen);
            // Glow
            const glow = new THREE.PointLight(0x00ffaa, 0.5, 3);
            glow.position.y = h;
            g.add(glow);
            g.position.set(x, 0, z);
            return g;
          }
          group.add(panel(-4, -2, 1.5));
          group.add(panel(4, -2, 1.5));
          group.add(panel(0, -4, 1.8));

          // Hologram pad
          const pad = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 0.05, 16),
            new THREE.MeshBasicMaterial({ color: 0x0044ff, transparent: true, opacity: 0.3 })
          );
          pad.position.set(0, 0.03, 0);
          group.add(pad);
          // Hologram beam
          const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.5, 2, 16, 1, true),
            new THREE.MeshBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.08, side: THREE.DoubleSide })
          );
          beam.position.set(0, 1, 0);
          group.add(beam);

          // Floating crystals
          for (let i = 0; i < 5; i++) {
            const crystal = new THREE.Mesh(
              new THREE.OctahedronGeometry(0.15, 0),
              new THREE.MeshToonMaterial({
                color: [0xff00ff, 0x00ffff, 0xff66ff, 0x66ffff, 0xaa88ff][i],
                emissive: [0x330033, 0x003333, 0x330033, 0x003333, 0x220044][i],
                emissiveIntensity: 0.5,
              })
            );
            crystal.position.set(
              (Math.random() - 0.5) * 8,
              1 + Math.random() * 2,
              (Math.random() - 0.5) * 6
            );
            crystal.userData.floatOffset = Math.random() * Math.PI * 2;
            crystal.userData.floatSpeed = 0.5 + Math.random() * 0.5;
            crystal.name = 'crystal';
            group.add(crystal);
          }
        }
      }
    };

    // --- Floor ---
    const floorMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 14),
      new THREE.MeshToonMaterial({ color: 0x2a2a4a })
    );
    floorMesh.rotation.x = -Math.PI / 2;
    scene.add(floorMesh);

    // --- Apply theme ---
    let currentTheme = 'office';

    function applyTheme(name) {
      const theme = themes[name];
      if (!theme) return;
      currentTheme = name;

      // Background
      scene.background = new THREE.Color(theme.bg);

      // Floor
      floorMesh.material.color.set(theme.floor.color);

      // Lights
      ambientLight.color.set(theme.ambient.color);
      ambientLight.intensity = theme.ambient.intensity;
      dirLight.color.set(theme.dirLight.color);
      dirLight.intensity = theme.dirLight.intensity;

      // Fog
      if (theme.fog) {
        scene.fog = new THREE.Fog(theme.fog.color, theme.fog.near, theme.fog.far);
      } else {
        scene.fog = null;
      }

      // Clear old props & animated objects
      while (propsGroup.children.length > 0) {
        propsGroup.remove(propsGroup.children[0]);
      }
      animatedObjects.length = 0;

      // Build new props
      theme.build(propsGroup);

      // Update button states
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === name);
      });

      // Body bg for areas outside canvas
      const bgColor = '#' + new THREE.Color(theme.bg).getHexString();
      document.body.style.background = bgColor;
    }

    // Init
    applyTheme('office');

    // Theme buttons
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    // --- Personality system ---
    // Each personality has a sequence of [anim, duration] pairs for what they do at waypoints
    const personalities = {
      // 보라: 정석파 — 꼼꼼하게 일함
      // [startAnim, holdAnim, duration] — startAnim 한번 재생 후 holdAnim으로 유지
      'pet-1': {
        name: '정석',
        moveAnim: 'Walking',
        moveSpeed: 0.04,
        acceptAnim: 'Yes',
        sequence: [
          ['Standing', 'Idle', 8000],      // 서서 분석 (Standing 후 Idle 유지)
          ['Sitting', 'Idle', 12000],      // 앉아서 코딩 (오래)
          ['ThumbsUp', 'Idle', 3000],      // 확인
          ['Standing', 'Idle', 8000],      // 서서 리뷰
          ['Yes', 'Idle', 5000],           // 끄덕 후 생각
        ],
      },
      // 민트: ADHD — 산만하지만 열정적
      'pet-2': {
        name: 'ADHD',
        moveAnim: 'Running',
        moveSpeed: 0.07,
        acceptAnim: 'Jump',
        sequence: [
          ['Dance', 'Dance', 6000],        // 춤 (반복)
          ['Jump', 'Idle', 3000],          // 점프 후 잠깐
          ['Punch', 'Idle', 4000],         // 키보드 펀치
          ['Dance', 'Dance', 5000],        // 또 춤
          ['Death', 'Death', 5000],        // 쓰러져서 한참 있음
          ['Jump', 'ThumbsUp', 3000],      // 일어나서 엄지척
        ],
      },
      // 코랄: 냉소파 — 귀찮지만 해야지
      'pet-3': {
        name: '냉소',
        moveAnim: 'Walking',
        moveSpeed: 0.025,
        acceptAnim: 'No',
        sequence: [
          ['No', 'Idle', 5000],            // 고개 가로젓고 멍
          ['Idle', 'Idle', 10000],         // 멍때림 (오래)
          ['Death', 'Death', 8000],        // 쓰러져서 한참
          ['Standing', 'Idle', 5000],      // 겨우 일어남
          ['Sitting', 'Idle', 10000],      // 앉아서 겨우 작업
          ['No', 'Idle', 6000],            // 또 고개 가로젓고 멍
        ],
      },
    };

    // --- Workers ---
    const workers = {};

    // Random waypoint generation per personality
    // range = how far they wander, stayBase/stayVariance = how long they stay
    const wanderConfig = {
      'pet-1': { range: 4, stayBase: 3000, stayVariance: 1500 },  // 정석: 적당히 넓게, 적당히 머묾
      'pet-2': { range: 6, stayBase: 1000, stayVariance: 1500 },  // ADHD: 넓게, 짧게 머묾
      'pet-3': { range: 2, stayBase: 4000, stayVariance: 2000 },  // 냉소: 좁게, 오래 머묾
    };

    function randomWaypoint(petId) {
      const cfg = wanderConfig[petId] || { range: 4, stayBase: 2500, stayVariance: 1500 };
      return {
        x: (Math.random() - 0.5) * cfg.range * 2,
        z: (Math.random() - 0.5) * cfg.range * 2,
      };
    }

    function randomStayDuration(petId) {
      const cfg = wanderConfig[petId] || { stayBase: 2500, stayVariance: 1500 };
      return cfg.stayBase + Math.random() * cfg.stayVariance;
    }

    function applyColor(obj, hexColor) {
      const color = new THREE.Color(hexColor);
      obj.traverse((child) => {
        if (child.isMesh && child.material) {
          const mat = child.material.clone();
          const c = mat.color ? mat.color.clone() : new THREE.Color(1,1,1);
          const lum = c.r * 0.299 + c.g * 0.587 + c.b * 0.114;
          if (lum > 0.3 && lum < 0.9) mat.color.lerp(color, 0.6);
          child.material = mat;
        }
      });
    }

    function spawnWorker(petId, petColor, callback) {
      const loader = new GLTFLoader();
      loader.load(pathModule.join(__dirname, 'assets', 'robot.glb'), (gltf) => {
        const group = new THREE.Group();
        const model = gltf.scene;
        const workerScale = (currentTheme === 'restaurant' || currentTheme === 'furniture') ? 0.25 : 0.35;
        model.scale.set(workerScale, workerScale, workerScale);
        applyColor(model, petColor);
        group.add(model);

        // Name label
        const c2d = document.createElement('canvas');
        c2d.width = 128; c2d.height = 32;
        const ctx = c2d.getContext('2d');
        ctx.fillStyle = petColor;
        ctx.beginPath(); ctx.roundRect(0, 0, 128, 32, 10); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(petId.replace('pet-', '#'), 64, 22);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c2d), transparent: true }));
        sp.scale.set(0.6, 0.15, 1);
        sp.position.y = 1.2;
        group.add(sp);

        group.position.set(8, 0, Math.random() * 4 - 2);
        scene.add(group);

        const mix = new THREE.AnimationMixer(model);
        const anims = {};
        gltf.animations.forEach(clip => { anims[clip.name] = mix.clipAction(clip); });

        const personality = personalities[petId] || personalities['pet-1'];
        const worker = {
          group, mixer: mix, animations: anims, currentAction: null,
          petId,
          state: 'entering',
          targetPos: new THREE.Vector3(),
          personality,
          seqIndex: 0,
          seqTimer: 0,
          subState: 'moving',
        };
        workers[petId] = worker;
        playWorkerAnim(worker, personality.moveAnim, { timeScale: 1.5 });
        if (callback) callback(worker);
      });
    }

    function playWorkerAnim(w, name, opts = {}) {
      if (!w.animations[name]) return;
      const a = w.animations[name];
      if (w.currentAction && w.currentAction !== a) w.currentAction.fadeOut(0.2);
      a.reset().fadeIn(0.2);
      a.setLoop(opts.loop !== false ? THREE.LoopRepeat : THREE.LoopOnce);
      if (opts.timeScale) a.timeScale = opts.timeScale;
      a.play();
      w.currentAction = a;
    }

    function pickWP(w) {
      const wp = randomWaypoint(w.petId);
      w.targetPos.set(wp.x, 0, wp.z);
    }

    // --- Logs ---
    const logMsgs = ['코드 분석 중...', 'Sentry 이슈 확인 중...', '관련 파일 검색 중...', '수정 방안 검토 중...', '테스트 실행 중...', '결과 정리 중...', 'Slack 메시지 확인...', 'Jira 티켓 업데이트 중...'];
    let logIdx = 0;

    function addLog(msg) {
      const panel = document.getElementById('logPanel');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entry.textContent = `[${time}] ${msg}`;
      panel.appendChild(entry);
      panel.scrollTop = panel.scrollHeight;
    }

    function addTaskChip(petName, petColor, message) {
      const chip = document.createElement('div');
      chip.className = 'task-chip';
      chip.id = `chip-${petName}`;
      chip.innerHTML = `<span class="dot" style="background:${petColor}"></span>${petName}: ${message}`;
      document.getElementById('tasksBar').appendChild(chip);
    }

    function completeTaskChip(petName) {
      const chip = document.getElementById(`chip-${petName}`);
      if (chip) chip.classList.add('done');
    }

    // --- IPC ---
    ipcRenderer.on('task-started', (event, { petId, petName, petColor, message }) => {
      addTaskChip(petName, petColor, message);
      addLog(`🏃 ${petName}이(가) 달려오는 중...`);
      document.getElementById('status-text').textContent = `${Object.keys(workers).length + 1}마리 작업 중...`;

      spawnWorker(petId, petColor, (worker) => {
        setTimeout(() => {
          if (worker.state === 'entering') {
            // Accept animation first
            const p = worker.personality;
            playWorkerAnim(worker, p.acceptAnim, { loop: false });
            addLog(`📋 ${petName}(${p.name}): "${message}" 작업 시작!`);

            // Then start working
            setTimeout(() => {
              worker.state = 'working';
              worker.subState = 'moving';
              pickWP(worker);
              playWorkerAnim(worker, p.moveAnim);
            }, 1500);
          }
        }, 1500);

        const interval = setInterval(() => {
          if (worker.state === 'exiting' || worker.state === 'gone') { clearInterval(interval); return; }
          addLog(`${petName}: ${logMsgs[logIdx % logMsgs.length]}`);
          logIdx++;
        }, 1500);
      });
    });

    ipcRenderer.on('task-done', (event, { petId, petName, message }) => {
      const worker = workers[petId];
      if (worker) {
        worker.state = 'exiting';
        playWorkerAnim(worker, 'Running', { timeScale: 1.5 });
        addLog(`✅ ${petName}: "${message}" 완료!`);
        completeTaskChip(petName);
      }
      const active = Object.values(workers).filter(w => w.state === 'working' || w.state === 'entering').length;
      document.getElementById('status-text').textContent = active > 0 ? `${active}마리 작업 중...` : '모두 완료!';
    });

    // --- Animation ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const t = clock.getElapsedTime();

      // Animate theme objects (birds, etc.)
      animatedObjects.forEach(ao => {
        if (ao.mixer) ao.mixer.update(delta);
        // Birds circle around
        if (ao.obj && ao.obj.name === 'bird') {
          const b = ao.obj;
          const angle = t * b.userData.speed;
          b.position.x = b.userData.centerX + Math.cos(angle) * b.userData.radius;
          b.position.z = b.userData.centerZ + Math.sin(angle) * b.userData.radius;
          b.rotation.y = -angle + Math.PI / 2;
        }
      });

      // (city theme has no special animations needed)

      // Animate space crystals
      if (currentTheme === 'space') {
        propsGroup.traverse(child => {
          if (child.name === 'crystal') {
            child.rotation.y += delta * 0.5;
            child.position.y = child.position.y + Math.sin(t * child.userData.floatSpeed + child.userData.floatOffset) * 0.002;
          }
        });
      }

      Object.entries(workers).forEach(([id, w]) => {
        if (w.mixer) w.mixer.update(delta);

        if (w.state === 'entering') {
          // Each pet enters to a different random spot
          if (!w.enterTarget) {
            w.enterTarget = randomWaypoint(w.petId);
          }
          const dx = w.enterTarget.x - w.group.position.x;
          const dz = w.enterTarget.z - w.group.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > 0.5) {
            w.group.position.x += (dx / dist) * 0.1;
            w.group.position.z += (dz / dist) * 0.1;
            w.group.rotation.y = Math.atan2(dx, dz);
          }
        }

        if (w.state === 'working') {
          const p = w.personality;

          if (w.subState === 'moving') {
            // Move to waypoint
            const dx = w.targetPos.x - w.group.position.x;
            const dz = w.targetPos.z - w.group.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > 0.3) {
              w.group.position.x += (dx / dist) * p.moveSpeed;
              w.group.position.z += (dz / dist) * p.moveSpeed;
              w.group.rotation.y = Math.atan2(dx, dz);
            } else {
              // Arrived → start performing sequence step
              w.subState = 'performing';
              w._holdStarted = false;
              const [startAnim, holdAnim, baseDur] = p.sequence[w.seqIndex % p.sequence.length];
              const duration = baseDur * (0.8 + Math.random() * 0.4);
              // Play start anim once
              const isOneShot = ['Jump', 'Death', 'Punch', 'ThumbsUp', 'Yes', 'No', 'Sitting', 'Standing'].includes(startAnim);
              playWorkerAnim(w, startAnim, { loop: !isOneShot });
              w.seqTimer = duration;
              // Transition to hold anim after start plays
              if (isOneShot && holdAnim !== startAnim) {
                w._holdAnim = holdAnim;
                w._holdDelay = 1200; // wait for one-shot to finish
              } else {
                w._holdAnim = null;
              }
            }
          }

          if (w.subState === 'performing') {
            w.seqTimer -= delta * 1000;

            // Transition from one-shot start to hold anim
            if (w._holdAnim && !w._holdStarted) {
              w._holdDelay -= delta * 1000;
              if (w._holdDelay <= 0) {
                playWorkerAnim(w, w._holdAnim, { loop: true });
                w._holdStarted = true;
              }
            }

            if (w.seqTimer <= 0) {
              w.seqIndex++;
              // Every 2 steps, move to a new waypoint
              if (w.seqIndex % 2 === 0) {
                w.subState = 'moving';
                pickWP(w);
                playWorkerAnim(w, p.moveAnim);
              } else {
                // Next sequence step at current spot
                w._holdStarted = false;
                const [startAnim, holdAnim, baseDur] = p.sequence[w.seqIndex % p.sequence.length];
                const duration = baseDur * (0.8 + Math.random() * 0.4);
                const isOneShot = ['Jump', 'Death', 'Punch', 'ThumbsUp', 'Yes', 'No', 'Sitting', 'Standing'].includes(startAnim);
                playWorkerAnim(w, startAnim, { loop: !isOneShot });
                w.seqTimer = duration;
                if (isOneShot && holdAnim !== startAnim) {
                  w._holdAnim = holdAnim;
                  w._holdDelay = 1200;
                } else {
                  w._holdAnim = null;
                }
              }
            }
          }
        }

        if (w.state === 'exiting') {
          w.group.position.x -= 0.1;
          w.group.rotation.y = -Math.PI / 2;
          if (w.group.position.x < -8) {
            w.state = 'gone';
            scene.remove(w.group);
            delete workers[id];
          }
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });
  </script>
</body>
</html>
