<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .header {
      padding: 14px 20px;
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status-text { font-weight: 500; }

    .tasks-bar {
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
      overflow-x: auto;
    }

    .task-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 6px 14px;
      color: white;
      font-size: 12px;
      white-space: nowrap;
      animation: chipIn 0.3s ease-out;
    }

    .task-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .task-chip.done { opacity: 0.5; }
    .task-chip.done .dot { animation: none; }

    @keyframes chipIn {
      0% { transform: translateY(-10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #office-canvas {
      width: 100%;
      height: calc(100vh - 110px);
    }

    .log-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-family: 'SF Mono', 'Menlo', monospace;
      max-height: 90px;
      overflow-y: auto;
    }

    .log-entry {
      padding: 2px 0;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <span id="status-text">대기 중...</span>
  </div>
  <div class="tasks-bar" id="tasksBar"></div>
  <canvas id="office-canvas"></canvas>
  <div class="log-panel" id="logPanel"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const THREE = require('three');
    const { GLTFLoader } = require('three/examples/jsm/loaders/GLTFLoader.js');
    const pathModule = require('path');

    // --- Three.js setup ---
    const canvas = document.getElementById('office-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
    camera.position.set(0, 5, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // --- Lighting ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(5, 8, 5);
    scene.add(dl);

    // --- Floor ---
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 14),
      new THREE.MeshToonMaterial({ color: 0x2a2a4a })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const grid = new THREE.GridHelper(14, 14, 0x4a4a6a, 0x3a3a5a);
    grid.position.y = 0.01;
    scene.add(grid);

    // --- Desks ---
    function createDesk(x, z) {
      const g = new THREE.Group();
      const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.8), new THREE.MeshToonMaterial({ color: 0x8B7355 }));
      top.position.y = 0.6;
      g.add(top);
      const mon = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.05), new THREE.MeshToonMaterial({ color: 0x333333 }));
      mon.position.set(0, 0.95, -0.2);
      g.add(mon);
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), new THREE.MeshBasicMaterial({ color: 0x66aaff }));
      scr.position.set(0, 0.95, -0.17);
      g.add(scr);
      g.position.set(x, 0, z);
      return g;
    }

    scene.add(createDesk(-3, -1));
    scene.add(createDesk(0, -2));
    scene.add(createDesk(3, -1));
    scene.add(createDesk(-1.5, 1));
    scene.add(createDesk(1.5, 1));

    // --- Worker agents in office ---
    const workers = {}; // petId → { group, mixer, animations, currentAction, state, targetPos, wpIndex }

    const waypoints = [
      { x: -3, z: 0 }, { x: 0, z: -1 }, { x: 3, z: 0 },
      { x: -1.5, z: 2 }, { x: 1.5, z: 2 }, { x: 0, z: 0 },
      { x: -2, z: 3 }, { x: 2, z: 3 },
    ];

    function applyColor(obj, hexColor) {
      const color = new THREE.Color(hexColor);
      obj.traverse((child) => {
        if (child.isMesh && child.material) {
          const mat = child.material.clone();
          const origColor = mat.color ? mat.color.clone() : new THREE.Color(1, 1, 1);
          const lum = origColor.r * 0.299 + origColor.g * 0.587 + origColor.b * 0.114;
          if (lum > 0.3 && lum < 0.9) {
            mat.color.lerp(color, 0.6);
          }
          child.material = mat;
        }
      });
    }

    function spawnWorker(petId, petColor, callback) {
      const loader = new GLTFLoader();
      const modelPath = pathModule.join(__dirname, 'assets', 'robot.glb');

      loader.load(modelPath, (gltf) => {
        const group = new THREE.Group();
        const model = gltf.scene;
        model.scale.set(0.35, 0.35, 0.35);
        applyColor(model, petColor);
        group.add(model);

        // Name label (sprite)
        const spCanvas = document.createElement('canvas');
        spCanvas.width = 128;
        spCanvas.height = 32;
        const ctx = spCanvas.getContext('2d');
        ctx.fillStyle = petColor;
        ctx.beginPath();
        ctx.roundRect(0, 0, 128, 32, 10);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(petId.replace('pet-', '#'), 64, 22);
        const tex = new THREE.CanvasTexture(spCanvas);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sp.scale.set(0.6, 0.15, 1);
        sp.position.y = 1.2;
        group.add(sp);

        group.position.set(8, 0, Math.random() * 4 - 2);
        scene.add(group);

        const mix = new THREE.AnimationMixer(model);
        const anims = {};
        gltf.animations.forEach(clip => {
          anims[clip.name] = mix.clipAction(clip);
        });

        const worker = {
          group,
          mixer: mix,
          animations: anims,
          currentAction: null,
          state: 'entering',
          targetPos: new THREE.Vector3(0, 0, 0),
          wpIndex: Math.floor(Math.random() * waypoints.length),
        };

        workers[petId] = worker;
        playWorkerAnim(worker, 'Running', { timeScale: 1.5 });
        if (callback) callback(worker);
      });
    }

    function playWorkerAnim(worker, name, options = {}) {
      if (!worker.animations[name]) return;
      const newAction = worker.animations[name];
      if (worker.currentAction && worker.currentAction !== newAction) {
        worker.currentAction.fadeOut(0.2);
      }
      newAction.reset();
      newAction.fadeIn(0.2);
      newAction.setLoop(options.loop !== false ? THREE.LoopRepeat : THREE.LoopOnce);
      if (options.timeScale) newAction.timeScale = options.timeScale;
      newAction.play();
      worker.currentAction = newAction;
    }

    function pickWP(worker) {
      worker.wpIndex = (worker.wpIndex + 1) % waypoints.length;
      const wp = waypoints[worker.wpIndex];
      worker.targetPos.set(wp.x, 0, wp.z);
    }

    // --- Logs ---
    const logMsgs = [
      '코드 분석 중...', 'Sentry 이슈 확인 중...', '관련 파일 검색 중...',
      '수정 방안 검토 중...', '테스트 실행 중...', '결과 정리 중...',
      'Slack 메시지 확인...', 'Jira 티켓 업데이트 중...',
    ];
    let logIdx = 0;

    function addLog(msg) {
      const panel = document.getElementById('logPanel');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entry.textContent = `[${time}] ${msg}`;
      panel.appendChild(entry);
      panel.scrollTop = panel.scrollHeight;
    }

    function addTaskChip(petName, petColor, message) {
      const bar = document.getElementById('tasksBar');
      const chip = document.createElement('div');
      chip.className = 'task-chip';
      chip.id = `chip-${petName}`;
      chip.innerHTML = `<span class="dot" style="background:${petColor}"></span>${petName}: ${message}`;
      bar.appendChild(chip);
    }

    function completeTaskChip(petName) {
      const chip = document.getElementById(`chip-${petName}`);
      if (chip) chip.classList.add('done');
    }

    // --- IPC ---
    ipcRenderer.on('task-started', (event, { petId, petName, petColor, message }) => {
      addTaskChip(petName, petColor, message);
      addLog(`🏃 ${petName}이(가) 달려오는 중...`);
      document.getElementById('status-text').textContent = `${Object.keys(workers).length + 1}마리 작업 중...`;

      spawnWorker(petId, petColor, (worker) => {
        setTimeout(() => {
          if (worker.state === 'entering') {
            worker.state = 'working';
            pickWP(worker);
            playWorkerAnim(worker, 'Running');
            addLog(`📋 ${petName}: "${message}" 작업 시작!`);
          }
        }, 1500);

        // Periodic logs
        const interval = setInterval(() => {
          if (worker.state === 'exiting' || worker.state === 'gone') { clearInterval(interval); return; }
          addLog(`${petName}: ${logMsgs[logIdx % logMsgs.length]}`);
          logIdx++;
        }, 1500);
      });
    });

    ipcRenderer.on('task-done', (event, { petId, petName, message }) => {
      const worker = workers[petId];
      if (worker) {
        worker.state = 'exiting';
        playWorkerAnim(worker, 'Running', { timeScale: 1.5 });
        addLog(`✅ ${petName}: "${message}" 완료!`);
        addLog(`🏃 ${petName}이(가) 돌아가는 중...`);
        completeTaskChip(petName);
      }

      // Update status
      const active = Object.values(workers).filter(w => w.state === 'working' || w.state === 'entering').length;
      document.getElementById('status-text').textContent = active > 0 ? `${active}마리 작업 중...` : '모두 완료!';
    });

    // --- Animation ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      Object.entries(workers).forEach(([id, w]) => {
        if (w.mixer) w.mixer.update(delta);

        if (w.state === 'entering') {
          const dx = 0 - w.group.position.x;
          const dz = 0 - w.group.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > 0.5) {
            const speed = 0.1;
            w.group.position.x += (dx / dist) * speed;
            w.group.position.z += (dz / dist) * speed;
            w.group.rotation.y = Math.atan2(dx, dz);
          }
        }

        if (w.state === 'working') {
          const dx = w.targetPos.x - w.group.position.x;
          const dz = w.targetPos.z - w.group.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > 0.3) {
            const speed = 0.04;
            w.group.position.x += (dx / dist) * speed;
            w.group.position.z += (dz / dist) * speed;
            w.group.rotation.y = Math.atan2(dx, dz);
          } else {
            pickWP(w);
          }
        }

        if (w.state === 'exiting') {
          w.group.position.x -= 0.1;
          w.group.rotation.y = -Math.PI / 2;
          if (w.group.position.x < -8) {
            w.state = 'gone';
            scene.remove(w.group);
            delete workers[id];
          }
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });
  </script>
</body>
</html>
